<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Soundboard iCarly & memes</title>
<style>
  :root{
    --bg:#FAF5EA;
    --surface:#F1E8D8;
    --surface-2:#E9DEC9;
    --ink:#2A241C;
    --ink-dim:#6B6152;
    --accent:#1F7A8C;
    --accent-ink:#FFFFFF;
    --border:rgba(42,36,28,0.14);
    --ring:rgba(31,122,140,0.55);

    --cat-icarly:#C9551D;
    --cat-nick:#6E4FC9;
    --cat-spongebob:#1D6FA5;
    --cat-meme:#2E8B57;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#121110;
      --surface:#1C1A18;
      --surface-2:#262320;
      --ink:#F2EDE6;
      --ink-dim:#ABA398;
      --accent:#3BDEF7;
      --accent-ink:#08202A;
      --border:rgba(242,237,230,0.14);
      --ring:rgba(59,222,247,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121110;
    --surface:#1C1A18;
    --surface-2:#262320;
    --ink:#F2EDE6;
    --ink-dim:#ABA398;
    --accent:#3BDEF7;
    --accent-ink:#08202A;
    --border:rgba(242,237,230,0.14);
    --ring:rgba(59,222,247,0.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:32px;
    transition:background .2s ease, color .2s ease;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header h1{
    font-size:19px;
    margin:0;
    flex:1;
    line-height:1.25;
  }
  header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-dim);
  }
  .icon-btn{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{width:20px;height:20px;}
  .stop-btn{
    width:auto;
    padding:0 14px;
    gap:8px;
    font-size:14px;
    font-weight:600;
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .category{
    margin-bottom:28px;
  }
  .category h2{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-dim);
    margin:0 0 12px;
  }
  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
  }
  .cat-icarly .dot{background:var(--cat-icarly);}
  .cat-nick .dot{background:var(--cat-nick);}
  .cat-spongebob .dot{background:var(--cat-spongebob);}
  .cat-meme .dot{background:var(--cat-meme);}
  .cat-icarly h2{border-left:3px solid var(--cat-icarly);padding-left:10px;}
  .cat-nick h2{border-left:3px solid var(--cat-nick);padding-left:10px;}
  .cat-spongebob h2{border-left:3px solid var(--cat-spongebob);padding-left:10px;}
  .cat-meme h2{border-left:3px solid var(--cat-meme);padding-left:10px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:10px;
  }
  .sound-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:88px;
    padding:12px 8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    text-align:center;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  }
  .sound-btn:active{
    transform:scale(0.96);
    background:var(--surface-2);
  }
  .sound-btn.playing{
    box-shadow:0 0 0 3px var(--ring);
    background:var(--surface-2);
  }
  .sound-btn .icon{
    width:22px;
    height:22px;
    color:var(--accent);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sound-btn .icon svg{width:100%;height:100%;}
  .sound-btn .label{line-height:1.2;}
  .sound-btn .time{
    font-size:11px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .sound-btn .bar{
    width:100%;
    height:3px;
    border-radius:2px;
    background:var(--border);
    overflow:hidden;
  }
  .sound-btn .bar-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .1s linear;
  }

  footer{
    max-width:720px;
    margin:24px auto 0;
    padding:0 16px;
    font-size:12px;
    color:var(--ink-dim);
    line-height:1.5;
  }
</style>
</head>

<script>
  // Tema: arranca según el sistema, luego respeta lo que el usuario elija
  const root = document.documentElement;
  const saved = localStorage.getItem('soundboard-theme');
  if (saved) root.setAttribute('data-theme', saved);

  function currentTheme(){
    const attr = root.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncIcons(){
    const dark = currentTheme() === 'dark';
    document.getElementById('iconSun').style.display = dark ? 'block' : 'none';
    document.getElementById('iconMoon').style.display = dark ? 'none' : 'block';
  }
  syncIcons();

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('soundboard-theme', next);
    syncIcons();
  });

  // Reproducción de sonidos, con pausa/reanudación y tiempo transcurrido
  const BASE = 'https://www.myinstants.com';
  const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
  const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>';

  function fmtTime(t){
    if (!isFinite(t) || t < 0) return '0:00';
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  const activeSounds = [];

  document.querySelectorAll('.sound-btn').forEach(btn => {
    const iconEl = btn.querySelector('.icon');
    const timeEl = btn.querySelector('.time');
    const fillEl = btn.querySelector('.bar-fill');
    let audio = null;

    function setPlaying(isPlaying){
      btn.classList.toggle('playing', isPlaying);
      iconEl.innerHTML = isPlaying ? PAUSE_ICON : PLAY_ICON;
    }

    function updateTime(){
      const dur = audio && isFinite(audio.duration) ? audio.duration : 0;
      const cur = audio ? audio.currentTime : 0;
      timeEl.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
      fillEl.style.width = dur ? `${Math.min(100, (cur / dur) * 100)}%` : '0%';
    }

    btn.addEventListener('click', () => {
      if (!audio) {
        audio = new Audio(BASE + btn.dataset.src);
        activeSounds.push({ get audio(){ return audio; }, setPlaying, updateTime });
        audio.addEventListener('loadedmetadata', updateTime);
        audio.addEventListener('timeupdate', updateTime);
        audio.addEventListener('ended', () => {
          audio.currentTime = 0;
          setPlaying(false);
          updateTime();
        });
        setPlaying(true);
        audio.play().catch(() => {
          setPlaying(false);
          alert('No se pudo reproducir. Revisa tu conexión a internet.');
          audio = null;
        });
        return;
      }
      if (audio.paused) {
        audio.play();
        setPlaying(true);
      } else {
        audio.pause();
        setPlaying(false);
      }
    });
  });

  document.getElementById('stopAll').addEventListener('click', () => {
    activeSounds.forEach(({ audio, setPlaying, updateTime }) => {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
      setPlaying(false);
      updateTime();
    });
  });
</script>
